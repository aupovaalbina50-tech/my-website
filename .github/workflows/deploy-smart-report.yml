# Deploys the smart-report Edge Function to Supabase. Run by hand:
# GitHub → Actions → «Deploy smart-report» → Run workflow.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
name: Deploy smart-report

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy smart-report --project-ref znfuaxqpvdpvjrtmiupj
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
