# Collects abbreviation records from emle.kz for review (the Claude session
# that prepares the catalog has no access to the site). Results go to the
# abbr-source-results branch; nothing is written to the site or database.
name: Abbreviations source

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/abbr/**'
      - '.github/workflows/abbr-source.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/abbr/run.mjs
      - name: Results to the abbr-source-results branch
        if: always()
        run: |
          [ -d out ] || exit 0
          git config user.name "abbr-source" && git config user.email "abbr-source@users.noreply.github.com"
          tmp=$(mktemp -d) && cp -r out/. "$tmp"/
          git switch --orphan results
          git rm -rfq . 2>/dev/null || true
          cp -r "$tmp"/. . && git add -A && git commit -qm "Abbreviations source ${{ github.run_id }}"
          git push -f origin HEAD:abbr-source-results
