# Deploys the doc-inspector Edge Function to Supabase. Run by hand:
# GitHub → Actions → «Deploy doc-inspector» → Run workflow.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
name: Deploy doc-inspector

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy doc-inspector --project-ref znfuaxqpvdpvjrtmiupj
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
