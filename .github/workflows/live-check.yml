# Checks the live site in a real browser (scripts/live-check/check.mjs) and
# publishes the report as a comment on the pull request, screenshots to the
# live-check-results branch. Runs on pull requests that touch the check, and
# by hand: GitHub → Actions → «Live site check» → Run workflow.
name: Live site check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/live-check/**'
      - '.github/workflows/live-check.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node scripts/live-check/check.mjs
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      - name: Server logs
        if: always()
        run: sleep 60 && node scripts/live-check/logs.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Screenshots to the live-check-results branch
        if: always()
        run: |
          [ -d out ] || exit 0
          git config user.name "live-check" && git config user.email "live-check@users.noreply.github.com"
          tmp=$(mktemp -d) && cp -r out/. "$tmp"/
          git fetch origin live-check-results || true
          git switch --orphan results
          git rm -rfq . 2>/dev/null || true
          cp -r "$tmp"/. . && git add -A && git commit -qm "Live check ${{ github.run_id }}"
          git push -f origin HEAD:live-check-results
      - name: Report as a PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: '[ -f out/report.md ] && gh pr comment ${{ github.event.pull_request.number }} --body-file out/report.md || true'
